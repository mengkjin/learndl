<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiment Dashboards</title>
<style>
:root{color-scheme:dark;font:14px/1.6 system-ui;background:#10161e;color:#dce8ee}body{max-width:1200px;margin:40px auto;padding:0 24px}header,.controls,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}section{background:#17212c;border:1px solid #344355;border-radius:12px;padding:24px;margin:24px 0}input,select,button{background:#202c3a;color:inherit;border:1px solid #425468;border-radius:6px;padding:9px}select.path{flex:1;min-width:220px}button{cursor:pointer}button:disabled{opacity:.4}.instance{border-top:1px solid #344355;padding:16px 0;margin-top:14px}.row strong{flex:1;overflow-wrap:anywhere;min-width:180px}small,summary{color:#9eb3c8}pre{white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#ffb6a6}h1{font-size:28px}input.limit{width:65px}</style>
<header><h1 id="title"></h1><select id="lang"><option value="zh">中文</option><option value="en">English</option></select></header><p id="error" role="alert"></p><main id="main"></main>
<script>
const token='__TOKEN__',kinds=['tensorboard','optuna'];let lang=localStorage.getItem('learndl-language')||'zh',busy=false,refreshing=false,instances=[];
const t=(zh,en)=>lang==='zh'?zh:en;
const channel=typeof BroadcastChannel==='function'?new BroadcastChannel('learndl-experiments'):null;
async function api(path,body){const response=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error);return data;}
function node(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e;}
function layout(){document.getElementById('title').textContent=t('实验面板','Experiment Dashboards');const main=document.getElementById('main');main.replaceChildren();for(const kind of kinds){const section=node('section');section.id=kind;section.append(node('h2',kind==='optuna'?'Optuna':'TensorBoard'));const controls=node('div');controls.className='controls';const path=node('select');path.className='path';path.id=kind+'-sources';path.setAttribute('aria-label',t('数据源','Data source'));const start=node('button',t('启动','Start'));start.onclick=()=>{if(!path.value){document.getElementById('error').textContent=t('请先选择数据源','Select a data source first');return;}act({action:'start',kind,source:path.value});};const label=node('label',t('上限 ','Limit '));const limit=node('input');limit.type='number';limit.min=1;limit.className='limit';label.append(limit);const save=node('button',t('保存','Save'));save.onclick=()=>act({action:'limit',kind,value:Number(limit.value)});const reload=node('button',t('刷新数据源','Refresh sources'));reload.onclick=sources;const stopAll=node('button',t('全部关闭','Stop all'));stopAll.onclick=()=>act({action:'stop_all',kind,targets:instances.filter(r=>r.kind===kind).map(r=>({pid:r.pid,created:r.created}))});controls.append(path,start,reload,label,save,stopAll);section.append(controls,node('div'));section.lastChild.className='instances';main.append(section);}sources();refresh();}
async function sources(){try{const data=await api('sources');for(const kind of kinds){const list=document.getElementById(kind+'-sources'),selected=list.value;list.replaceChildren();const placeholder=node('option',t('请选择数据源','Select a data source'));placeholder.value='';placeholder.disabled=true;placeholder.selected=true;list.append(placeholder);for(const group of data[kind]){const options=node('optgroup');options.label=group[lang]||group.en;if(!group.items.length){const empty=node('option',t('暂无结果','No results'));empty.disabled=true;options.append(empty);}for(const source of group.items){const option=node('option',source.label);option.value=source.path;option.title=source.path;options.append(option);}list.append(options);}if([...list.options].some(o=>o.value===selected))list.value=selected;}}catch(e){document.getElementById('error').textContent=e.message;}}
async function act(data){if(data.action==='stop_all'&&!confirm(t('确认关闭此类型的全部实例（包含外部实例）：','Stop all instances of this type (including external): ')+data.targets.length+'?'))return;if(data.action==='stop'&&!confirm(t('确认关闭实例 PID ','Stop instance PID ')+data.pid+'?'))return;let popup=null;if(data.action==='start'){popup=window.open('','_blank');if(popup){popup.opener=null;popup.document.body.textContent=t('正在启动…','Starting…');}}busy=true;if(data.action==='email')document.getElementById('error').textContent=t('正在打包并发送邮件…','Packaging and sending email…');document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await api('action',data);const url=result.url||result.instance?.url;if(data.action==='start'&&!url)throw Error(t('实例尚未就绪，请稍后点击打开。','Instance not ready yet. Use Open when ready.'));if(popup){if(url)popup.location.replace(url);else popup.close();}document.getElementById('error').textContent=data.action==='start'&&!popup?t('浏览器阻止了新窗口，请点击打开。','Popup blocked. Click Open.'):'';if(data.action==='email')document.getElementById('error').textContent=result.mail_status==='sent'?t('邮件已发送。','Email sent.'):t('邮件尚未全部发送，已交由项目邮件队列重试，请勿重复点击。','Delivery pending; the project mail queue will retry. Please do not resend.');channel?.postMessage('changed');}catch(e){if(popup&&!popup.closed)popup.close();document.getElementById('error').textContent=e.message;}finally{busy=false;await refresh();}}
async function refresh(){if(refreshing)return;refreshing=true;try{const data=await api('status');instances=data.instances;for(const kind of kinds){const section=document.getElementById(kind),rows=data.instances.filter(r=>r.kind===kind);section.querySelector('h2').textContent=(kind==='optuna'?'Optuna':'TensorBoard')+` (${rows.length}/${data.limits[kind]})`;const limit=section.querySelector('.limit');if(document.activeElement!==limit)limit.value=data.limits[kind];section.querySelectorAll('button').forEach(b=>b.disabled=busy);section.querySelector('.controls button').disabled=busy||rows.length>=data.limits[kind];const root=section.querySelector('.instances');const expanded=new Set([...root.querySelectorAll('details[open]')].map(d=>d.dataset.pid));root.replaceChildren();for(const row of rows){const item=node('div');item.className='instance';const top=node('div');top.className='row';top.append(node('strong',row.display_source||row.source||t('外部实例','External instance')),node('small',row.status==='running'?t('运行中','Running'):t('未就绪','Not ready')));const open=node('button',t('打开','Open'));open.disabled=!row.url;open.onclick=()=>window.open(row.url,'_blank','noopener');const stop=node('button',t('关闭','Stop'));stop.disabled=busy||!row.controllable;stop.onclick=()=>act({action:'stop',kind,pid:row.pid,created:row.created});const email=node('button',t('发送邮件','Send email'));email.disabled=busy||!row.source;email.title=t('仅打包此实例的日志文件夹或数据库，发送到项目默认邮箱','Send only this instance’s logs or database to the project default recipient');email.onclick=()=>act({action:'email',kind,pid:row.pid,created:row.created});top.append(open,email,stop);const details=node('details');details.dataset.pid=String(row.pid);details.open=expanded.has(String(row.pid));details.append(node('summary',t('详情','Details')),node('pre',`PID ${row.pid} · ${row.origin==='managed'?t('面板启动','Managed'):t('外部发现','External')}\n${new Date(row.created*1000).toLocaleString()}\n${row.url}\n${row.ssh}\n${row.error}`));const logs=node('button',t('日志','Logs'));logs.onclick=async()=>{try{const data=await api('log/'+row.pid);alert(data.log);}catch(e){alert(e.message);}};details.append(logs);item.append(top,details);root.append(item);}}}catch(e){document.getElementById('error').textContent=e.message;}finally{refreshing=false;}}
document.getElementById('lang').value=lang;document.getElementById('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('learndl-language',lang);layout();};if(channel)channel.onmessage=()=>refresh();window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});layout();setInterval(refresh,2000);
</script></html>
