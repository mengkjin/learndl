<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learndl Monitor</title>
<meta name="console-token" content="__CONSOLE_TOKEN__">
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10161e;color:#e2e8f0}
*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:60px auto;padding:0 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:20px}h1{font-size:30px;font-weight:550;letter-spacing:-1px;margin:0}
.header-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.filter{position:relative}
.filter-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:200px;max-width:calc(100vw - 40px);max-height:65vh;overflow:auto;z-index:20;padding:12px;background:#17212c;border:1px solid #344355;border-radius:9px;box-shadow:0 8px 24px #0008}
.filter-panel label{display:flex;align-items:center;gap:8px;padding:6px 2px;cursor:pointer}
.filter-panel input{accent-color:#55ccb9}
.filter-panel button{margin-top:8px}
select,button{background:#202c3a;color:#dce8ee;border:1px solid #344355;border-radius:7px;padding:10px 12px;cursor:pointer}
button:hover,button:focus-visible{border-color:#55ccb9}button:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{position:relative;background:#17212c;border:1px solid #293748;border-radius:12px;padding:24px}
.card{padding-top:10px}
.card h2{overflow-wrap:anywhere}
.card-controls{display:flex;justify-content:flex-end;gap:0;margin:0 -8px 2px}
.card-controls button{display:grid;place-items:center;width:21px;height:23px;padding:0;font-size:15px;line-height:1;color:#a8bdcc;background:transparent;border-color:transparent}
.hide-card svg{width:15px;height:15px}
#restart-console{width:38px;padding:0;height:38px;font-size:22px;line-height:1}
#restart-request{margin-bottom:16px}
#restart-request[hidden]{display:none}
#empty{text-align:center;padding:24px;color:#a8bdcc}
#preferences-error{color:#ffb6a6;margin-bottom:15px;font-size:13px}
#preferences-error:empty{display:none}
h2{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:550;margin:0 0 24px;outline-offset:5px}
.dot{width:7px;height:7px;flex:none;border-radius:50%;background:#67778b}.running .dot{background:#55ccb9}.starting .dot,.scanning .dot,.restarting .dot{background:#e9bd6d}.failed .dot{background:#ef9f91}
.actions{display:flex;flex-wrap:wrap;gap:7px}.primary{background:#27564f;color:#96edda;border-color:#33776b}
.tooltip{display:none;position:absolute;z-index:10;left:16px;right:16px;top:65px;padding:16px;background:#243342;border:1px solid #466079;border-radius:8px;box-shadow:0 12px 30px #0008;font:13px/1.8 monospace;white-space:pre-line;overflow-wrap:anywhere;color:#c3d1df;pointer-events:none}
h2:hover+.tooltip,h2:focus+.tooltip{display:block}#notice{color:#ffb6a6;margin-bottom:15px;font-size:13px}#notice:empty{display:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}main{margin-top:30px}h1{font-size:25px}}
@media(max-width:600px){header{flex-wrap:wrap;gap:12px}.header-controls{flex-wrap:wrap;max-width:100%}}
@media(max-width:380px){.filter-panel{right:auto;left:0}}
</style>
<main>
<header><h1>Learndl Monitor</h1><div class="header-controls">
 <div class="filter" id="filter">
  <button id="filter-toggle" type="button" aria-controls="filter-panel" aria-expanded="false" disabled>子服务</button>
  <div class="filter-panel" id="filter-panel" hidden>
   <div id="filter-options"></div><button id="show-all" type="button"></button>
  </div>
 </div>
 <select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select>
 <button id="restart-console" type="button" title="重启控制台" aria-label="重启控制台">↻</button>
</div></header>
<div id="notice" role="alert"></div><div id="preferences-error" role="alert"></div>
<section class="actions" id="restart-request" hidden></section>
<section class="grid" id="cards"></section>
<div id="empty" hidden><p id="empty-message"></p><button id="empty-show-all" type="button"></button></div>
</main>
<script>
let token=document.querySelector('meta[name=console-token]').content;
const restartIntent=new URLSearchParams((location.hash||'').slice(1));
if(token)sessionStorage.setItem('learndl-token',token);
history.replaceState(null,'',location.pathname);
let lang=localStorage.getItem('learndl-language')||'zh',services=[];
let hiddenServices=new Set(),preferencesReady=false,savingPreferences=false,preferencesGeneration=0;
let serviceOrder=[];
let restartingConsole=false;
if(!['zh','en'].includes(lang))lang='zh';
const labels={
 zh:{start:'启动',open:'打开',restart:'重启',stop:'关闭',stopped:'已关闭',running:'运行中',starting:'启动中',stopping:'关闭中',restarting:'重启中',scanning:'扫描中',unavailable:'未就绪',managed:'控制台启动',external:'外部发现',confirm:'确认执行此操作？',descriptions:{mail_archive:'同步邮件、执行信息及附件',model_preview:'训练、测试日志与实验结果',compare:'已有模型结果的交互对比',experiments:'TensorBoard 与 Optuna 多实例管理',tasks:'任务状态、运行输出与进程管理',storage:'磁盘占用、目录分布与快照报告',research:'数据、模型与研究工作流'}},
 en:{start:'Start',open:'Open',restart:'Restart',stop:'Stop',stopped:'Stopped',running:'Running',starting:'Starting',stopping:'Stopping',restarting:'Restarting',scanning:'Scanning',unavailable:'Not ready',managed:'Console managed',external:'Discovered externally',confirm:'Confirm this operation?',descriptions:{mail_archive:'Synced mail and attachments',model_preview:'Training and test logs and results',compare:'Interactive comparison of existing model results',experiments:'TensorBoard and Optuna instance management',tasks:'Task status, live output and process controls',storage:'Disk usage, directory insights and snapshot reports',research:'Data, models and research workflows'}}
};
const t=key=>labels[lang][key]||key;
async function request(path,options={}){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);
 try{return await fetch(path,{...options,cache:'no-store',signal:controller.signal});}
 finally{clearTimeout(timeout);}
}
async function api(path,body,retry=true){
 const sentToken=token;
 const r=await request(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+sentToken,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(r.status===403&&retry){
  // A running console may have restarted since this tab was opened.
  const page=await request('/');
  if(page.ok){
   const current=new DOMParser().parseFromString(await page.text(),'text/html').querySelector('meta[name=console-token]');
   if(current?.content&&current.content!==sentToken){token=current.content;return api(path,body,false);}
  }
 }
 if(!r.ok){
  const fallback=lang==='zh'?'请求失败，请稍后重试。':'Request failed. Please try again.';
  const error=await r.json().catch(()=>({}));
  if(r.status===403&&!error.error&&['/api/preferences','/api/restart'].includes(path)){
   throw Error(lang==='zh'?'当前控制台后端尚未更新，请从 CLI 重启 Learndl Monitor。':'This console is running an older backend. Restart Learndl Monitor from the CLI.');
  }
  throw Error(error.error||fallback);
 }
 return r.json();
}
function element(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
function setFilterOpen(open){
 document.getElementById('filter-panel').hidden=!open;
 document.getElementById('filter-toggle').setAttribute('aria-expanded',String(open));
}
function renderFilter(ordered){
 const restart=document.getElementById('restart-console');
 restart.title=lang==='zh'?'重启控制台':'Restart console';
 restart.setAttribute('aria-label',restart.title);
 restart.disabled=restartingConsole;
 const toggle=document.getElementById('filter-toggle');
 toggle.textContent=lang==='zh'?'子服务':'Services';
 toggle.disabled=!preferencesReady;
 const options=document.getElementById('filter-options');
 for(const [index,service] of ordered.entries()){
  let row=document.getElementById('filter-'+service.id);
  if(!row){
   row=element('label');row.id='filter-'+service.id;
   const input=element('input');input.type='checkbox';
   input.onchange=()=>{
    const visible=input.checked;
    input.checked=!hiddenServices.has(service.id);
    savePreferences({service:service.id,visible});
   };
   row.append(input,element('span'));options.append(row);
  }
  const input=row.querySelector('input');
  input.checked=!hiddenServices.has(service.id);
  input.setAttribute('aria-disabled',String(savingPreferences));
  row.querySelector('span').textContent=service[lang];
  if(options.children[index]!==row)options.insertBefore(row,options.children[index]||null);
 }
 for(const id of ['show-all','empty-show-all']){
  const button=document.getElementById(id);
  button.textContent=lang==='zh'?'全部显示':'Show all';
  button.disabled=savingPreferences||!hiddenServices.size;
 }
 document.getElementById('empty-message').textContent=lang==='zh'?'所有子服务已隐藏。':'All services are hidden.';
 document.getElementById('empty').hidden=!preferencesReady||!services.length||services.some(s=>!hiddenServices.has(s.id));
}
async function restartConsole(){
 if(restartingConsole||!confirm(lang==='zh'?'重启 Learndl Monitor？子服务会继续运行。':'Restart Learndl Monitor? Child services will keep running.'))return;
 restartingConsole=true;
 render();
 const notice=document.getElementById('preferences-error');
 notice.textContent=lang==='zh'?'控制台正在重启…':'Restarting console…';
 try{
  const {instance}=await api('/api/restart',{});
  const deadline=Date.now()+20000;
  while(Date.now()<deadline){
   await new Promise(resolve=>setTimeout(resolve,500));
   const status=await api('/api/services').catch(()=>null);
   if(status?.instance&&status.instance!==instance){location.reload();return;}
  }
  throw Error(lang==='zh'?'控制台尚未重新连接，请稍后刷新。':'Console has not reconnected. Try refreshing shortly.');
 }catch(error){
  notice.textContent=error.message;
  restartingConsole=false;
  render();
 }
}
function serviceAddress(id, address) {
 if (id !== 'tasks') return address;
 const url = new URL(address);
 url.searchParams.set('lang', lang);
 return url.href;
}
function prepareServiceRestart(){
 const key=restartIntent.get('restart-service'), port=Number(restartIntent.get('port'));
 if(!key)return;
 const panel=document.getElementById('restart-request');
 const service=services.find(item=>item.id===key&&item.url&&Number(new URL(item.url).port)===port);
 panel.hidden=false;
 if(!service||service.state!=='running'){
  panel.textContent=lang==='zh'?'该服务当前无法重启，请检查控制台上的服务状态。':'This service cannot restart now. Check its status in the console.';
  return;
 }
 const caption=element('span',lang==='zh'?`重启 ${service[lang]}？`:`Restart ${service[lang]}?`);
 caption.setAttribute('role','status');
 const accept=element('button',t('restart')), cancel=element('button',lang==='zh'?'返回':'Back');
 cancel.onclick=()=>location.replace(serviceAddress(key, service.url));
 accept.onclick=async()=>{
  accept.disabled=true;cancel.disabled=true;caption.textContent=t('restarting')+' · '+service[lang];
  try{
   await api('/api/action',{service:key,action:'restart',pid:service.pid,created:service.created});
   notifyChange();
   for(let i=0;i<90;i++){
    const current=(await api('/api/services')).services.find(item=>item.id===key);
    if(current?.error)throw Error(current.error);
    if(current?.state==='running'&&current.url&&(current.pid!==service.pid||current.created!==service.created)){
     location.replace(serviceAddress(key, current.url));return;
    }
    await new Promise(resolve=>setTimeout(resolve,1000));
   }
   throw Error(lang==='zh'?'服务尚未就绪，请查看对应卡片状态。':'Service is not ready. Check its card for status.');
  }catch(error){
   caption.textContent=error.message;
   accept.remove();cancel.remove();
   refresh();
  }
 };
 panel.replaceChildren(caption,accept,cancel);
 accept.focus();
}
async function savePreferences(change,returnFocus=false){
 if(savingPreferences)return;
 savingPreferences=true;
 preferencesGeneration++;
 const notice=document.getElementById('preferences-error');
 notice.textContent='';
 render();
 try{
  const result=await api('/api/preferences',change);
  hiddenServices=new Set(result.preferences.hidden);
  serviceOrder=result.preferences.order||[];
  if(returnFocus)document.getElementById('filter-toggle').focus();
  notifyChange();
 }catch(error){notice.textContent=error.message;}
 finally{
  preferencesGeneration++;
  savingPreferences=false;
  render();
  refresh();
 }
}
function render(){
 document.documentElement.lang=lang;
 const ranks=new Map(serviceOrder.map((id,index)=>[id,index]));
 const ordered=[...services].sort((a,b)=>(ranks.get(a.id)??ranks.size)-(ranks.get(b.id)??ranks.size));
 renderFilter(ordered);
 if(!preferencesReady)return;
 const root=document.getElementById('cards');
 const visible=ordered.filter(service=>!hiddenServices.has(service.id));
 // Keep card nodes in place during polling so hovering and keyboard focus remain stable.
 ordered.forEach((s,index)=>{
  let card=document.getElementById('service-'+s.id);
  if(!card){
   card=element('article',null,'card');card.id='service-'+s.id;
   const title=element('h2');title.tabIndex=0;title.append(element('span',null,'dot'),element('span'));
   const tip=element('div',null,'tooltip');tip.id='details-'+s.id;tip.role='tooltip';title.setAttribute('aria-describedby',tip.id);
   const controls=element('div',null,'card-controls');
   for(const [move,symbol] of [['earlier','+'],['later','−']]){
    const button=element('button',symbol);button.type='button';button.dataset.move=move;
    button.onclick=async()=>{
     await savePreferences({service:s.id,move});
     (button.disabled?title:button).focus();
    };
    controls.append(button);
   }
   const hide=element('button',null,'hide-card');hide.type='button';
   hide.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9 5.5a10 10 0 0 1 3-.5c5.1 0 8.4 4.6 9 7a11 11 0 0 1-2.2 3.5M6 6.8A13 13 0 0 0 3 12c.6 2.4 3.9 7 9 7a9 9 0 0 0 4.3-1.1"/></svg>';
   hide.onclick=()=>savePreferences({service:s.id,visible:false},true);
   controls.append(hide);
   card.append(controls,title,tip,element('div',null,'actions'));root.append(card);
  }
  if(root.children[index]!==card)root.insertBefore(card,root.children[index]||null);
  if(hiddenServices.has(s.id)&&card.contains(document.activeElement))document.getElementById('filter-toggle').focus();
  card.hidden=hiddenServices.has(s.id);
  const hide=card.querySelector('.hide-card');
  hide.title=lang==='zh'?`隐藏 ${s[lang]}`:`Hide ${s[lang]}`;
  hide.setAttribute('aria-label',hide.title);
  hide.disabled=savingPreferences;
  const earlier=card.querySelector('[data-move=earlier]'),later=card.querySelector('[data-move=later]');
  earlier.title=lang==='zh'?`前移 ${s[lang]}`:`Move ${s[lang]} earlier`;
  later.title=lang==='zh'?`后移 ${s[lang]}`:`Move ${s[lang]} later`;
  for(const button of [earlier,later])button.setAttribute('aria-label',button.title);
  earlier.disabled=savingPreferences||visible[0]===s;
  later.disabled=savingPreferences||visible[visible.length-1]===s;
  card.className='card '+s.state+(s.error?' failed':'');
  card.querySelector('h2 span:last-child').textContent=s[lang];
  card.querySelector('.tooltip').textContent=[labels[lang].descriptions[s.id],t(s.state),s.pid?`PID ${s.pid} · ${t(s.source)} · ${s.uptime}s · ${s.count} ${lang==='zh'?'个实例':'instance(s)'}`:'',s.url||`127.0.0.1:${s.port}`,s.snapshot,s.error].filter(Boolean).join('\n');
  const actions=card.querySelector('.actions');
  for(const action of ['start','open','restart','stop']){
   let b=actions.querySelector('[data-action='+action+']');
   if(!b){b=element('button');b.dataset.action=action;actions.append(b);}
   b.textContent=t(action);b.className=action==='start'?'primary':'';
   b.disabled=action==='start'?s.state!=='stopped':action==='open'?!s.url:action==='stop'?(!s.pid||['stopping','restarting'].includes(s.state)):!['running','unavailable'].includes(s.state);
   b.onclick=async()=>{
    let popup=null;
    try{
     if(action==='open'){window.open(serviceAddress(s.id, s.url),'_blank','noopener');return;}
     if(['restart','stop'].includes(action)&&!confirm(`${t('confirm')}\n${s[lang]} · PID ${s.pid} · ${t(s.source)}`))return;
     if(action==='start'){popup=window.open('','_blank');if(popup){popup.opener=null;popup.document.body.textContent=lang==='zh'?'正在启动…':'Starting…';}}
     b.disabled=true;await api('/api/action',{service:s.id,action,pid:s.pid,created:s.created});notifyChange();await refresh();
     if(action==='start'){
      let address='';
      for(let attempt=0;attempt<90;attempt++){
       const state=(await api('/api/services')).services.find(item=>item.id===s.id);
       if(state?.url){address=state.url;break;}
       if(state?.error)throw Error(state.error);
       await new Promise(resolve=>setTimeout(resolve,1000));
      }
      if(!address)throw Error(lang==='zh'?'启动尚未就绪，请稍后点击打开。':'Not ready yet. Use Open when ready.');
      if(popup&&!popup.closed)popup.location.replace(serviceAddress(s.id, address));else document.getElementById('notice').textContent=lang==='zh'?'浏览器阻止了新窗口，请点击打开。':'Popup blocked. Click Open.';
     }
    }catch(e){if(popup&&!popup.closed)popup.close();document.getElementById('notice').textContent=e.message;}
   };
  }
 });
}
let refreshing=null,refreshAgain=false,lastState='';
const channel=typeof BroadcastChannel==='function'?new BroadcastChannel('learndl-services'):null;
function notifyChange(){
 if(channel)channel.postMessage('changed');
 // Also covers browsers without BroadcastChannel. Never transmit credentials.
 try{localStorage.setItem('learndl-services-changed',Date.now()+':'+Math.random());}catch{}
}
function refresh(){
 if(refreshing){refreshAgain=true;return refreshing;}
 refreshing=(async()=>{
  try{
   const generation=preferencesGeneration;
   const response=await api('/api/services');
   services=response.services;
   if(!savingPreferences&&generation===preferencesGeneration){
    hiddenServices=new Set(response.preferences?.hidden||[]);
    serviceOrder=response.preferences?.order||[];
    preferencesReady=true;
   }
   render();document.getElementById('notice').textContent='';
   const state=JSON.stringify(services.map(s=>[s.id,s.state,s.pid,s.created,s.url,s.error,s.snapshot]));
   if(state!==lastState){lastState=state;notifyChange();}
  }catch(e){document.getElementById('notice').textContent=e.message;}
  finally{refreshing=null;if(refreshAgain){refreshAgain=false;queueMicrotask(refresh);}}
 })();
 return refreshing;
}
if(channel)channel.onmessage=()=>refresh();
window.addEventListener('storage',event=>{if(event.key==='learndl-services-changed')refresh();});
window.addEventListener('focus',()=>refresh());
window.addEventListener('pageshow',()=>refresh());
window.addEventListener('online',()=>refresh());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
document.getElementById('language').value=lang;
document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('learndl-language',lang);render();};
const filter=document.getElementById('filter'),filterToggle=document.getElementById('filter-toggle');
filterToggle.onclick=()=>setFilterOpen(document.getElementById('filter-panel').hidden);
document.getElementById('show-all').onclick=()=>savePreferences({show_all:true});
document.getElementById('restart-console').onclick=restartConsole;
document.getElementById('empty-show-all').onclick=()=>savePreferences({show_all:true},true);
document.addEventListener('click',event=>{if(!filter.contains(event.target))setFilterOpen(false);});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!document.getElementById('filter-panel').hidden){
  setFilterOpen(false);filterToggle.focus();
 }
});
refresh().then(prepareServiceRestart);setInterval(refresh,2000);
</script>
</html>
