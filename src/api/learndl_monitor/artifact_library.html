   if(activeModel!==key){activeModel=key;activeBuild=null;active='';version='';render();}
  });
  b.replaceChildren(element('span',builds.find(b=>key===activeModel&&b.build===activeBuild)?.name||builds[0].name),localized(element('small'),()=>
   model.host+' · '+count(total,['个版本','build','builds'])));
  b.className='item';b.setAttribute('aria-current',String(key===activeModel));item.append(b);
  if(key===activeModel&&builds.length>1){
   const list=element('div');list.className='model-builds';
   for(const build of builds){
    const choose=button(()=>[build.name!==model.name?build.name:'',build.build||t('history')].filter(Boolean).join(' · '),()=>{
     activeBuild=build.build;active='';version='';render();
    });
    choose.className='item';choose.setAttribute('aria-current',String(build.build===activeBuild));list.append(choose);
   }
   item.append(list);
  }
  return item;
 });
 $('items').replaceChildren(...entries);
 bindings.delete($('count'));localized($('count'),()=>count(modelEntries.size,['个模型','model','models']));
 const pane=$('detail'), preview=$('model-file-detail');bindings.delete(pane);
 preview.hidden=!current;
 if(!current){
  resetModelPreview();
  localized(pane,()=>t('noModel'));return;
 }
 const m=current.builds.find(build=>build.build===activeBuild);
 const versions=m.versions||[];
 if(!versions.some(v=>v.batch===version))version=versions[0]?.batch??'';
 const snapshot=versions.find(v=>v.batch===version);
 const members=new Set(snapshot?.files||[]);
 const filesForModel=(groups.get(activeModel)||[]).filter(r=>(r.build||'')===activeBuild);
 const unique=new Map();
 for(const row of filesForModel){
  if(!m.build&&row.relative?.match(/^(configs|logs)\//)&&versions.length&&!members.has(row.id))continue;
  const path=row.relative||row.label;
  if(!unique.has(path))unique.set(path,row);
 }
 shown=[...unique.values()];
 if(preview.hidden||!shown.some(r=>r.id===active))resetModelPreview();
 const identity=JSON.stringify([activeModel,activeBuild]);
 const previous=pane.dataset.build===identity
  ?new Map([...pane.querySelectorAll('details[data-section]')].map(node=>[node.dataset.section,node.open]))
  :new Map();
 pane.dataset.build=identity;
 const files=element('div'), actions=element('div');
 actions.className='actions model-actions';files.className='model-files';
 const heading=element('div');heading.className='row model-heading';
 heading.append(element('h2',m.name));
 const caption=localized(element('small'),()=>m.host+' · '+(m.build||t('history')));
 const hideBuild=action('hide',async()=>{
  const data=await (await api('/api/model-management')).json();
  const entry=data.records.find(row=>row.model_id===(m.id||activeModel)&&row.build===m.build);
  await confirmOperation('hide',[{id:entry.id}]);
 });
 const picker=element('div');
 if(!m.build&&versions.some(v=>v.batch)){
  const select=field('metadata-version','history');
  select.append(...versions.map((v,i)=>localized(new Option('',v.batch),()=>
   [i===0?t('latest'):'',v.batch?batchDate(v.batch):'',v.historical?t('backfill'):''].filter(Boolean).join(' · '))));
  select.value=version;select.onchange=()=>{version=select.value;render();};
  const lab=element('label');lab.append(label('span','history'),' ',select);picker.append(lab);
  if(snapshot?.missing)picker.append(label('small','incomplete'));
 }
 const sectionOf=r=>r.type==='tensorboard'?'TensorBoard':r.type==='optuna'?'Optuna':
  r.relative?.startsWith('configs/')?'configurations':
  /^(logs|run_logs|html)\//.test(r.relative||'')||r.type==='process_log'?'logs':'results';
 for(const key of ['configurations','logs','results','TensorBoard','Optuna']){
  const items=shown.filter(r=>sectionOf(r)===key);
  if(!items.length)continue;
  const section=element('details');section.dataset.section=key;
  section.append(localized(element('summary'),()=>t(key)+' · '+items.length),...items.map(modelFileRow));files.append(section);
 }
 const info=element('details');info.className='model-section';info.dataset.section='modelInfo';
 info.append(label('summary','modelInfo'),...properties(m));
 const fileSection=element('details');fileSection.className='model-section';fileSection.dataset.section='modelFiles';
 fileSection.append(label('summary','modelFiles'),picker,files);
 pane.replaceChildren(heading,caption,actions,info,fileSection);
 const sections=[...pane.querySelectorAll('details[data-section]')];
 for(const section of sections) section.open=previous.get(section.dataset.section)??(section===fileSection);
 const toggle=button('',()=>{
  const open=!sections.every(section=>section.open);
  for(const section of sections)section.open=open;
  updateToggle();
 });
 const updateToggle=()=>{toggle.textContent=t(sections.every(section=>section.open)?'collapseDetails':'expandDetails');};
 localized(toggle,()=>t(sections.every(section=>section.open)?'collapseDetails':'expandDetails'));
 for(const section of sections)section.ontoggle=updateToggle;
 actions.append(toggle);
 actions.append(action('modelFolder',folder('model_folder',activeModel,activeBuild)),hideBuild);
}
function resetModelPreview(){
 active='';
 if(blobURL){URL.revokeObjectURL(blobURL);blobURL='';}
 $('model-file-detail').replaceChildren(label('h2','filePreview'),label('p','selectFile'));
}
function modelFileRow(r){
 const line=element('div');
 if(['tensorboard','optuna'].includes(r.type)){
  line.className='experiment-row';
  const actions=element('div'), status=element('span');
  actions.className='actions';
  const start=action('start',async()=>{
   const data=await (await api('/api/action',{action:'start',id:r.id})).json();
   const address=data.url||data.instance?.url;
   if(!address)throw Error(t('ready'));
   const link=label('a','openInstance');link.href=address;link.target='_blank';link.rel='noopener';
   status.replaceChildren(link);
  });
  const stop=action('stop',async()=>{
   await api('/api/action',{action:'stop',id:r.id});status.replaceChildren(label('small','stopped'));
  });
  actions.append(start,stop,status);
  line.append(element('span',r.label),actions);return line;
 }
 const b=button(r.label,()=>modelFileDetails(r));
 b.className='item';b.dataset.file=r.id;b.setAttribute('aria-current',String(active===r.id));
 if(r.relative&&r.relative!==r.label)b.append(element('small',r.relative));
 line.append(b);return line;
}
async function modelFileDetails(r){
 active=r.id;
 for(const b of document.querySelectorAll('[data-file]'))b.setAttribute('aria-current',String(b.dataset.file===active));
 const pane=$('model-file-detail'), header=element('div'), actions=element('div'), preview=element('div');
 if(blobURL){URL.revokeObjectURL(blobURL);blobURL='';}
 header.className='preview-header';actions.className='actions';preview.id='preview';
 actions.append(action('folder',folder('folder',r.id)),action('openFile',async()=>{
  if(!confirm(t('confirmFile')))return;
  await api('/api/action',{action:'open_file',id:r.id});
 }));
 header.append(element('h2',r.label),actions);pane.replaceChildren(header,preview);
 if(r.type==='process_log')await chapters(r,0);
 else if(/\.(md|txt|html|pdf|xlsx|json|jsonl|ya?ml|log|toml)$/i.test(r.label))await file(r,0,r.label);
 else localized(preview,()=>t('noPreview'));
}
function renderActions(){
 const view=$('view').value, countLabel=$('count');
 const ops=view==='trash'?['restore','purge']:[view==='archived'?'unarchive':'archive','delete'];
 bindings.delete(countLabel);
 localized(countLabel,()=>items(mailTotal)+' · '+tr('已选 ','Selected ')+items(selected.size));
 const pick=action(selected.size?'clear':'selectAll',()=>{
  if(selected.size)selected.clear();else shown.filter(r=>!r.readonly).slice(0,500).forEach(r=>selected.add(r.id));
  render();
 });
 pick.disabled=!shown.some(r=>!r.readonly);
 $('actions').replaceChildren(pick,...ops.map(key=>{
  const b=action(key,async()=>{
   if(['delete','purge'].includes(key)&&!confirm(t(key)+' '+items(selected.size)+'?'))return;
   const result=await (await api('/api/action',{action:key,ids:[...selected]})).json();
   await refresh();selected.clear();active='';render();
   setNotice(()=>result.filter(r=>!r.ok).map(r=>(rows.find(item=>item.id===r.id)?.label||r.id)+' '+r.error)
    .join('\n')||t('processed')+' '+items(result.length));
  });b.disabled=selected.size===0;return b;
 }));
}
async function downloadOriginal(r,index){
 const response=await api(url('/api/file',{id:r.id,index}));
 const anchor=element('a'), downloadURL=URL.createObjectURL(await response.blob());
 anchor.href=downloadURL;anchor.download='message.eml';anchor.click();
 setTimeout(()=>URL.revokeObjectURL(downloadURL),30000);
}
async function file(r,index,name){
 if(name.toLowerCase().endsWith('.xlsx'))return spreadsheet(r,index);
 const target=$('preview');
 bindings.delete(target);
 const response=await api(url('/api/file',{id:r.id,index}));
 if(!target?.isConnected)return;
 const mime=response.headers.get('Content-Type');
 if(mime.startsWith('text/')&&mime!=='text/html'||mime==='application/json'){
  let content=await response.text();
  if(mime==='application/json')try{content=JSON.stringify(JSON.parse(content),null,2);}catch{}
  if(target.isConnected)target.replaceChildren(element('pre',content));
  return;
 }
 const blob=await response.blob();
 if(!target.isConnected)return;
 if(modelPage&&!['text/html','application/pdf'].includes(blob.type)){
  localized(target,()=>t('noPreview'));return;
 }
 if(blobURL)URL.revokeObjectURL(blobURL);
 blobURL=URL.createObjectURL(blob);
 if(['text/html','application/pdf'].includes(blob.type)){
  const frame=element('iframe');if(blob.type==='text/html')frame.setAttribute('sandbox','');frame.title=name;
  frame.src=blobURL;target.replaceChildren(frame);
 }else if(!modelPage&&blob.type.startsWith('image/')){
  const image=element('img');image.src=blobURL;image.alt=name;target.replaceChildren(image);
 }else{
  const anchor=localized(element('a'),()=>t('download')+' '+name);
  anchor.href=blobURL;anchor.download=name;target.replaceChildren(anchor);
  if(modelPage)anchor.click();
 }
}
async function spreadsheet(r,index,sheet=''){
 const target=$('preview');
 bindings.delete(target);localized(target,()=>t('loadSheet'));
 const workbook=await (await api(url('/api/spreadsheet',{id:r.id,index,sheet}))).json();
 if(!target.isConnected)return;
 const select=field('sheet-select','worksheet');
 select.append(...workbook.sheets.map(name=>new Option(name,name)));
 select.value=workbook.sheet;
 select.onchange=()=>spreadsheet(r,index,select.value).catch(e=>setNotice(()=>t('actionError')+' · '+e.message));
 const grid=element('div'), table=element('table');grid.className='sheet';
 for(const values of workbook.rows){
  const row=table.insertRow();
  for(const value of values)row.insertCell().textContent=value;
 }
 grid.append(table);
 bindings.delete(target);target.replaceChildren(select,label('small','sheetLimit'),grid);
}
function link(run,key,prefix=''){
 const a=localized(element('a'),()=>t(key)+prefix);
 a.href=url(other,{run});a.target='_blank';a.rel='noopener';return a;
}
async function mailHtmlFrame(r,index,name,doc=document){
 const response=await api(url('/api/mail-html',{id:r.id,index}));
 const {html}=await response.json();
 const frame=doc.createElement('iframe');
 frame.setAttribute('sandbox','');
 frame.referrerPolicy='no-referrer';
 frame.title=name;
 frame.srcdoc=html;
 return frame;
}
async function openMailHtml(r,index,name){
 const tab=window.open('','_blank');
 if(!tab)throw Error(t('htmlPopupBlocked'));
 try{
  tab.opener=null;
  tab.document.title=name;
  const frame=await mailHtmlFrame(r,index,name,tab.document);
  if(tab.closed)return;
  tab.document.body.style.margin='0';
  frame.style.cssText='position:fixed;inset:0;display:block;width:100%;height:100%;border:0';
  tab.document.body.replaceChildren(frame);
 }catch(error){
  tab.close();
  throw error;
 }
}
async function chapters(r,page){
 const target=$('preview');
 const data=await (await api(url('/api/chapters',{id:r.id,page,run:filters.get('run')||''}))).json();
 if(!target?.isConnected)return;
 target.replaceChildren();
 if(!data.pages)target.append(label('p','noChapters'));
 for(const c of data.chapters){
  const section=element('details'), idx=c.title.lastIndexOf(' · ');
  section.open=target.children.length===0;
  section.append(element('summary',c.title),link(c.title.slice(idx+3),'related'),element('pre',c.content));
  if(c.truncated)section.append(label('small','truncatedModel'));
  target.append(section);
 }
 if(page>0)target.append(action('previous',()=>chapters(r,page-1)));
 if(page+1<data.pages)target.append(action('next',()=>chapters(r,page+1)));
}
async function details(r){
 active=r.id;
 for(const b of document.querySelectorAll('[data-file]'))b.setAttribute('aria-current',String(b.dataset.file===active));
 const pane=$('detail'), header=element('div');
 bindings.delete(pane);header.className='row mail-heading';
 if(blobURL){URL.revokeObjectURL(blobURL);blobURL='';}
 header.append(element('h2',r.label));pane.replaceChildren(header);
 if(r.trashed){pane.append(label('p','mustRestore'));return;}
 header.append(action('folder',folder('folder',r.id)));

 const section=(key,expanded)=>{
  const node=element('details');node.className='mail-section';node.open=expanded;
  node.append(label('summary',key));return node;
 };
 const info=section('mailInfo',false), body=section('mailBody',true);
 body.classList.add('mail-body');
 const attachments=section('mailAttachments',true), preview=element('div');
 preview.id='mail-preview';
 const values=element('dl');values.className='properties';
 const field=(key,value)=>{if(value)values.append(label('dt',key),localized(element('dd'),typeof value==='function'?value:()=>value));};
 const m=r.metadata;
 field('mailType',()=>t(r.mail_type||'other'));
 field('mailTime',()=>r.stamp?formatDate(r.stamp):t('unknown'));
 field('host',[r.host,m.source].filter(Boolean).join(' · '));
 field('mailTask',m.task);field('mailScript',m.script);
 field('status',()=>t(m.status||'unknown'));field('smtp',()=>t(m.smtp_status||'unknown'));
 field('started',m.started_at?()=>formatDate(m.started_at):null);
 field('finished',m.finished_at?()=>formatDate(m.finished_at):null);
 field('Git HEAD',m.revision);field('runId',m.task_run_id);
 field('missing',m.missing_attachments?.join(', '));
 const links=element('div');links.className='actions';
 for(const id of m.model_runs||[])links.append(link(id,'modelRun',' '+id.slice(0,8)));
 const originalIndex=r.mail_parts?.indexOf('original')??-1;
 info.append(values,links);
 if(originalIndex>=0){
  links.append(action('original',()=>downloadOriginal(r,originalIndex)));
  info.addEventListener('toggle',async()=>{
   if(!info.open||info.dataset.headers)return;
   info.dataset.headers='loading';
   try{
    const headers=await (await api(url('/api/mail-headers',{id:r.id}))).json();
    for(const [key,value] of Object.entries(headers))field(key,value);
    info.dataset.headers='loaded';
   }catch(error){delete info.dataset.headers;setNotice(()=>t('actionError')+' · '+error.message);}
  });
 }
 const buttons=element('div');buttons.className='actions';
 r.files.forEach((name,index)=>{
  if(r.mail_parts?.[index])return;
  buttons.append(button(name,async()=>{
   if($('attachment-mode').value==='open'){
    if(/\.html?$/i.test(name)){await openMailHtml(r,index,name);return;}
    await api('/api/action',{action:'open_attachment',id:r.id,index});
    return;
   }
   if(blobURL){URL.revokeObjectURL(blobURL);blobURL='';}
   const target=element('div');target.id='preview';
   preview.replaceChildren(element('h2',name),target);
   if(/\.html?$/i.test(name)){
    const frame=await mailHtmlFrame(r,index,name);
    if(target.isConnected)target.replaceChildren(frame);
    return;
   }
   await file(r,index,name);
  }));
 });
 attachments.append(buttons.childElementCount?buttons:label('p','noAttachments'));
 const content=element('pre'), bodyIndex=r.mail_parts?.indexOf('body')??-1;
 body.append(content);pane.append(info,body,attachments,preview);
 if(bodyIndex<0){localized(content,()=>t('noBody'));return;}
 const response=await api(url('/api/file',{id:r.id,index:bodyIndex}));
 const message=await response.text();
 if(message.trim())content.textContent=message;else localized(content,()=>t('noBody'));
}
setup();
if(modelPage){
 restorePage();
 if(filters.has('archived'))$('view').value=filters.get('archived')==='1'?'archived':'active';
 if(location.pathname==='/manage'){
  $('preview-page').hidden=true;$('management').hidden=false;
  renderManagement().then(()=>scrollTo(0,history.state?.scroll||0));
 }else refresh().then(async()=>{if(active){const row=rows.find(row=>row.id===active);if(row)await modelFileDetails(row);}scrollTo(0,history.state?.scroll||0);});
}else{
 refresh();
 setInterval(()=>{
  if(!$('refresh').disabled)refresh();
 },60000);
}
</script>
</html>
