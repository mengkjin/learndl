<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · Learndl</title>
<style>
:root{color-scheme:dark;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10161e;color:#e2e8f0}
*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:36px auto;padding:0 24px}h1,h2{line-height:1.25}h1{font-size:28px;margin:0}header{justify-content:space-between;margin-bottom:16px}h2{font-size:19px;overflow-wrap:anywhere}
.toolbar[hidden]{display:none}.toolbar,.actions,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit;background:#202c3a;color:inherit;border:1px solid #3b4b60;border-radius:6px;padding:6px 10px}
button,select{cursor:pointer}button:hover,button:focus-visible{border-color:#55ccb9}a{color:#8de2d3}
.layout{display:grid;grid-template-columns:minmax(290px,2fr) minmax(330px,3fr);gap:18px;margin-top:14px}
.panel{border:1px solid #293748;border-radius:10px;background:#17212c;padding:14px;min-width:0}
#items{max-height:68vh;overflow:auto}#items label{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #273544}
.item{border:0;background:transparent;text-align:left;width:100%;overflow-wrap:anywhere}.item[aria-current=true]{color:#8de2d3;background:#203b3c}
.model-files{max-height:34vh;overflow:auto;margin:10px 0}
.model-files label{display:flex;align-items:center;gap:8px;border-bottom:1px solid #273544}
.model-files .item{font-size:14px}.model-actions{margin-top:10px}
.sheet{max-height:48vh;overflow:auto;margin-top:10px}.sheet table{border-collapse:collapse}
.sheet td{border:1px solid #3b4b60;padding:5px 8px;min-width:85px;max-width:260px;overflow-wrap:anywhere}
.model-builds{padding-left:20px}.model-heading{justify-content:space-between}.model-heading h2{margin:0}
#model-filters{margin-top:8px}.properties{margin:12px 0;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px}
.properties dt{color:#a6b8cc}.properties dd{margin:0;overflow-wrap:anywhere}
small{display:block;color:#a6b8cc}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{width:100%;height:57vh;background:white;border:0;border-radius:4px}
#notice{color:#f4bd9b;white-space:pre-wrap}details{margin:8px 0;border-bottom:1px solid #293748}summary{cursor:pointer;padding:6px 0}
@media(max-width:760px){main{margin:20px auto;padding:0 12px}.layout{grid-template-columns:1fr}#items{max-height:42vh}}
</style>
<main>
<header class="row"><h1>__TITLE__</h1><select id="language" aria-label="Language">
<option value="zh">中文</option><option value="en">English</option></select></header>
<div class="toolbar">
<input id="search" type="search">
<select id="host"></select><select id="status"></select><select id="view"></select>
<button id="refresh"></button>
</div>
<div id="model-filters" class="toolbar" hidden></div>
<p id="notice" role="status"></p>
<div class="layout">
<section class="panel"><div id="actions" class="actions"></div><small id="count" role="status"></small><div id="items"></div></section>
<section class="panel" id="detail" aria-live="polite"></section>
</div>
</main>
<script>
const kind='__KIND__', other='http://127.0.0.1:__OTHER__/';
const modelPage=kind==='model_preview', $=id=>document.getElementById(id);
const filters=new URLSearchParams(location.search), selected=new Set(), bindings=new WeakMap();
let lang=localStorage.getItem('learndl-language')==='en'?'en':'zh';
let rows=[], models={}, shown=[], active='', activeModel='', activeBuild=null, version='', blobURL='', loaded=false;
const tr=(zh,en)=>lang==='en'?en:zh;
const terms={
 title:modelPage?['模型预览','Model Preview']:['邮件档案','Mail Archive'],
 search:modelPage?['搜索模型或文件','Search models or files']:['搜索主题或脚本','Search subjects or scripts'],
 host:['来源','Source'], allHosts:['全部来源','All sources'], status:['执行状态','Execution status'],
 allStatus:['全部状态','All statuses'], view:['视图','View'], active:['当前','Active'],
 archived:['已归档','Archived'], trash:['回收站','Trash'], refresh:['刷新','Refresh'],
 loading:['正在加载记录…','Loading records…'], loadFailed:['记录加载失败','Could not load records'],
 catalogError:['无法载入目录','Could not load the catalog'], actionError:['操作失败','Action failed'],
 selectMail:['选择一条记录查看详情。','Select a record to view its details.'],
 selectModel:['选择一个模型查看结果。','Select a model to view its results.'],
 noMail:['没有符合条件的记录。','No matching records.'], noModel:['没有符合条件的模型。','No matching models.'],
 selectFile:['选择一个文件预览，或选择 TensorBoard / Optuna 启动。','Select a file to preview or choose TensorBoard / Optuna to launch.'],
 type:['模型类型','Model type'], module:['架构','Architecture'], stage:['生命周期阶段','Lifecycle stage'],
 short:['短测','Short test'], experiment:['实验产物','Experiment artifacts'], dateField:['日期字段','Date field'],
 from:['开始日期','From date'], to:['结束日期','To date'], unknown:['未知','Unknown'], yes:['是','Yes'], no:['否','No'],
 any:['全部','All'], allTypes:['全部类型','All types'], allModules:['全部架构','All architectures'],
 allStages:['全部阶段','All stages'], allExperiments:['全部实验产物','All experiment artifacts'],
 hasExperiment:['有实验产物','Has experiment artifacts'], noExperiment:['无实验产物','No experiment artifacts'],
 dateUnknown:['时间未知','Unknown time'], clearFilters:['清除筛选','Clear filters'], initial_training:['开始训练','First training started'],
 last_train:['最后训练','Last training completed'], last_test:['最后测试','Last test completed'],
 resume_training:['恢复训练汇总','Resumed training summary'], coverage:['交易日期范围','Trading date range'],
 cumulative:['累计覆盖范围','Cumulative range'], resumes:['恢复次数','Resume count'], estimated:['估算','Estimated'],
 propertyStatus:['状态','Status'], started:['开始时间','Started'], finished:['结束时间','Finished'],
 provenance:['来源依据','Evidence'], firstResume:['首次恢复','First resume'], runId:['运行 ID','Run ID'],
 file_created:['文件创建时间','File creation time'], file_modified:['文件修改时间','File modification time'],
 operation_log:['操作日志','Operation log'], training_history:['训练历史','Training history'],
 exploration:['探索','Exploration'], validation:['验证','Validation'], production:['生产','Production'],
 success:['成功','Success'], failed:['失败','Failed'], skipped:['跳过','Skipped'], running:['进行中','Running'],
 interrupted:['中断','Interrupted'], completed:['已完成','Completed'], sent:['已发送','Sent'],
 pending:['待处理','Pending'], queued:['已排队','Queued'], prepared:['已准备','Prepared'],
 modelFolder:['打开模型文件夹','Open model folder'], folder:['打开所在文件夹','Open containing folder'],
 confirmFolder:['在运行本服务的电脑打开文件夹？选择取消可查看路径。','Open the folder on the computer running this service? Choose Cancel to display its path.'],
 configurations:['配置','Configuration'], logs:['日志','Logs'], results:['结果文件','Result files'],
 history:['旧配置与日志批次','Legacy configuration and log batch'], build:['模型版本','Model build'], latest:['最新','Latest'],
 backfill:['历史补投','Historical backfill'], incomplete:['部分文件尚未到达','Some files have yet to arrive'],
 clear:['清空选择','Clear selection'], selectAll:['全选当前文件','Select all visible files'],
 select:['选择','Select'], restore:['恢复','Restore'], purge:['彻底删除','Permanently delete'],
 archive:['归档','Archive'], unarchive:['取消归档','Unarchive'], delete:['移到回收站','Move to Trash'],
 processed:['已处理','Processed'], download:['下载','Download'], downloadMD:['下载完整 Markdown','Download full Markdown'],
 preview:['预览或下载','Preview or download'], worksheet:['工作表','Worksheet'],
 loadSheet:['正在加载工作表…','Loading worksheet…'], sheetLimit:['预览最多显示前 40 行、20 列。','Preview limited to the first 40 rows and 20 columns.'],
 related:['查阅相关邮件','View related mail'], runFilter:['当前按关联运行筛选。','Filtered by related run.'],
 noChapters:['没有关联的运行章节。','No matching run chapters.'], truncated:['预览已截断，可下载完整 Markdown。','Preview truncated. Download the full Markdown.'],
 previous:['上一页','Previous'], next:['下一页','Next'], mustRestore:['从回收站恢复后即可查看。','Restore the item from Trash to view it.'],
 modelRun:['模型运行','Model run'], smtp:['SMTP 状态','SMTP status'], missing:['缺失附件','Missing attachments'],
 body:['正文','Body'], original:['原始邮件','Original email'], start:['启动或打开','Start or open'],
 stop:['停止','Stop'], ready:['实例尚未就绪','The instance is not ready'],
 stopped:['实例已停止。','Instance stopped.'], openInstance:['打开实验实例','Open experiment instance'],
 nn:['神经网络','Neural network'], boost:['提升树','Boosting'], factor:['因子','Factor'], linear:['线性模型','Linear model'],
};
const t=key=>terms[key]?.[lang==='en'?1:0]??key;
const element=(tag,value)=>{const e=document.createElement(tag);if(value)e.textContent=value;return e;};
const localized=(e,fn,attr)=>{
 const update=attr?()=>e.setAttribute(attr,fn()):()=>{e.textContent=fn();};
 if(!bindings.has(e))bindings.set(e,[]);
 bindings.get(e).push(update);
 e.dataset.localized='';
 update();
 return e;
};
const label=(tag,key)=>localized(element(tag),()=>t(key));
const button=(value,fn)=>{
 const b=element('button');b.type='button';
 if(typeof value==='function')localized(b,value);else b.textContent=value;
 b.onclick=()=>Promise.resolve().then(fn).catch(e=>setNotice(()=>t('actionError')+' · '+e.message));
 return b;
};
const action=(key,fn)=>button(()=>t(key),fn);
function notice(value){
 $('notice').textContent=typeof value==='function'?value():value;
 if(typeof value==='function')localized($('notice'),value);
}
function setNotice(value){
 bindings.delete($('notice'));
 notice(value);
}
const count=(total,noun)=>lang==='zh'?total+' '+noun[0]:total+' '+(total===1?noun[1]:noun[2]);
const items=total=>count(total,['项','item','items']);
const formatDate=value=>new Date(value).toLocaleString(lang==='en'?'en-US':'zh-CN');
const batchDate=batch=>{
 const match=batch.match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)/);
 return match?formatDate(`${match[1]}-${match[2]}-${match[3]}T${match[4]}:${match[5]}:${match[6]}Z`):batch;
};
async function api(path,body){
 const response=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer __TOKEN__','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(!response.ok){const error=await response.json();throw Error(error.error||t('actionError'));}
 return response;
}
const url=(path,params)=>path+'?'+new URLSearchParams(params);
function option(value,key=value){return localized(new Option('',value),()=>t(key));}
function options(id,values,empty='any'){
 const select=$(id), value=select.value;
 select.replaceChildren(option('',empty),...Array.from(new Set(values)).filter(Boolean).sort().map(x=>option(x)));
 select.value=Array.from(select.options).some(o=>o.value===value)?value:'';
}
function field(id,key,tag='select'){
 const e=element(tag);e.id=id;
 localized(e,()=>t(key),'aria-label');
 return e;
}
const modelFields={type:'module_type',module:'module',stage:'stage',short:'short_test'};
const filterLabels={type:'allTypes',module:'allModules',stage:'allStages',short:'short'};
function setup(){
 localized(document.querySelector('h1'),()=>t('title'));
 localized($('search'),()=>t('search'),'placeholder');
 localized($('search'),()=>t('search'),'aria-label');
 for(const id of ['host','status','view'])localized($(id),()=>t(id),'aria-label');
 $('view').append(...['active','archived','trash'].map(value=>option(value)));
 options('host',[],'allHosts');options('status',[],'allStatus');
 localized($('refresh'),()=>t('refresh'));
 localized($('count'),()=>t('loading'));
 localized($('detail'),()=>t(modelPage?'selectModel':'selectMail'));
 $('status').hidden=modelPage;
 if(modelPage){
  const bar=$('model-filters');bar.hidden=false;
  for(const id of Object.keys(modelFields))bar.append(field(id,id));
  const experiment=field('experiment','experiment');
  experiment.append(option('','allExperiments'),option('TensorBoard'),option('Optuna'),
                    option('yes','hasExperiment'),option('no','noExperiment'));
  const date=field('dateField','dateField');
  date.append(...['initial_training','last_train','last_test'].map(value=>option(value)));
  bar.append(experiment,date);
  for(const id of ['from','to']){
   const input=field(id,id,'input');input.type='date';
   const wrapper=element('label');wrapper.append(label('span',id),' ',input);bar.append(wrapper);
  }
  const unknown=field('dateUnknown','dateUnknown','input');unknown.type='checkbox';
  const wrapper=element('label');wrapper.append(unknown,label('span','dateUnknown'));bar.append(wrapper);
  bar.append(action('clearFilters',()=>{
   for(const id of ['search','host',...Object.keys(modelFields),'experiment','from','to'])$(id).value='';
   $('dateField').value='initial_training';$('dateUnknown').checked=false;render();
  }));
 }
 const ids=['search','host','status','view',...Object.keys(modelFields),'experiment','dateField','from','to','dateUnknown'];
 for(const id of ids)if($(id))$(id).oninput=render;
 $('refresh').onclick=refresh;
 $('language').value=lang;
 $('language').onchange=()=>{
  lang=$('language').value;localStorage.setItem('learndl-language',lang);updateLanguage();
 };
 if(filters.has('run'))setNotice(()=>t('runFilter'));
 updateLanguage();
}
function updateLanguage(){
 document.documentElement.lang=lang;document.title=t('title')+' · Learndl';
 for(const e of document.querySelectorAll('[data-localized]'))for(const update of bindings.get(e)||[])update();
}
async function refresh(){
 $('refresh').disabled=true;
 try{
  const data=await (await api(url(modelPage?'/api/models':'/api/list',{run:filters.get('run')||''}))).json();
  rows=modelPage?data.files:data;models=modelPage?data.models:{};
  options('host',rows.map(r=>r.host),'allHosts');options('status',rows.map(r=>r.metadata?.status),'allStatus');
  if(modelPage)for(const [id,key] of Object.entries(modelFields)){
   options(id,Object.values(models).map(m=>modelValue(m,key)),filterLabels[id]);
  }
  loaded=true;setNotice(filters.has('run')?()=>t('runFilter'):'');render();
 }catch(error){
  if(!loaded){bindings.delete($('count'));localized($('count'),()=>t('loadFailed'));}
  setNotice(()=>t('catalogError')+' · '+error.message);
 }finally{
  $('refresh').disabled=false;
 }
}
function modelValue(m,key){
 return key==='short_test'&&m[key]!=null?(m[key]?'yes':'no'):m[key]??'unknown';
}
function visibleState(r){
 const state=$('view').value;
 return state==='trash'?r.trashed:!r.trashed&&Boolean(r.archived)===(state==='archived');
}
const matchesText=(values,query)=>values.filter(Boolean).join(' ').toLowerCase().includes(query);
function modelMatches(model){
 if($('host').value&&model.host!==$('host').value)return false;
 for(const [id,key] of Object.entries(modelFields))if($(id).value&&$(id).value!==modelValue(model,key))return false;
 const exp=$('experiment').value;
 if(exp&&(exp==='yes'?!model.experiments.length:exp==='no'?model.experiments.length:
          !model.experiments.includes(exp.toLowerCase())))return false;
 const from=$('from').value, to=$('to').value, field=$('dateField').value;
 if(!from&&!to&&!$('dateUnknown').checked)return true;
 const value=field==='last_train'?model.last_train?.finished_at:field==='last_test'?
  model.properties?.last_test?.finished_at:model.properties?.initial_training?.started_at;
 if($('dateUnknown').checked)return !value;
 if(!value)return false;
 const date=new Date(value);
 const day=[date.getFullYear(),date.getMonth()+1,date.getDate()].map(n=>String(n).padStart(2,'0')).join('-');
 return (!from||day>=from)&&(!to||day<=to);
}
function render(){
 if(!loaded)return;
 const query=$('search').value.trim().toLowerCase();
 shown=rows.filter(visibleState);
 if(modelPage){renderModels(shown,query);return;}
 shown=shown.filter(r=>(!$('host').value||r.host===$('host').value)&&
  (!$('status').value||r.metadata?.status===$('status').value)&&
  matchesText([r.label,r.host,r.metadata?.task,r.metadata?.script,r.stamp],query));
 $('items').replaceChildren(...shown.map(fileRow));
 if(!shown.length)$('items').append(label('p','noMail'));
 trimSelection();renderActions();
}
function trimSelection(){
 const visible=new Set(shown.filter(r=>!r.readonly).map(r=>r.id));
 for(const id of selected)if(!visible.has(id))selected.delete(id);
}
function fileRow(r){
 const line=element('label'), b=button(r.label,()=>details(r));
 if(!r.readonly){
  const check=element('input');check.type='checkbox';check.checked=selected.has(r.id);
  localized(check,()=>t('select')+' '+r.label,'aria-label');
  check.onchange=()=>{check.checked?selected.add(r.id):selected.delete(r.id);renderActions();};
  line.append(check);
 }
 b.className='item';b.dataset.file=r.id;b.setAttribute('aria-current',String(active===r.id));
 b.append(localized(element('small'),()=> (modelPage?
  [r.relative!==r.label?r.relative:'',r.batch?batchDate(r.batch):'']:
  [r.host,r.metadata?.task,t(r.metadata?.status||''),r.stamp]).filter(Boolean).join(' · ')));
 line.append(b);return line;
}
function folder(actionName,id,build){
 return async()=>{
  const locally=confirm(t('confirmFolder'));
  const data=await (await api('/api/action',{action:actionName,id,build,open_locally:locally})).json();
  setNotice(data.folder);
 };
}
function properties(model){
 const fields=element('dl');fields.className='properties';
 const add=(key,fn)=>fields.append(label('dt',key),localized(element('dd'),fn));
 for(const [id,key] of Object.entries(modelFields))add(id,()=>t(modelValue(model,key)));
 const time=(record,key)=>record?.[key]?formatDate(record[key])+
  (record.status==='estimated'?' · '+t('estimated'):''):t('unknown');
 const props=model.properties||{};
 add('initial_training',()=>time(props.initial_training,'started_at'));
 add('last_train',()=>time(model.last_train,'finished_at'));
 add('last_test',()=>time(props.last_test,'finished_at'));
 const details=element('div');
 for(const key of ['initial_training','resume_training','last_test']){
  const record=props[key];
  if(!record)continue;
  const node=element('details'), values=element('dl');values.className='properties';
  const field=(key,fn)=>values.append(label('dt',key),localized(element('dd'),fn));
  field('started',()=>time(record,'started_at'));field('finished',()=>time(record,'finished_at'));
  field('propertyStatus',()=>t(record.status||'unknown'));
  field('coverage',()=>record.date_range?.join(' – ')||t('unknown'));
  if(record.count!=null){
   field('resumes',()=>String(record.count));
   field('firstResume',()=>time(record,'first_started_at'));
   field('cumulative',()=>record.cumulative_date_range?.join(' – ')||t('unknown'));
  }
  field('Git HEAD',()=>record.git_head||t('unknown'));
  if(record.source)field('provenance',()=>t(record.source)+(record.finish_source?' · '+t(record.finish_source):''));
  if(record.run_id)field('runId',()=>record.run_id);
  node.append(label('summary',key),values);details.append(node);
 }
 return [fields,details];
}
function renderModels(records,query){
 const groups=new Map();
 for(const row of records){
  const key=row.model_id;
  if(!key)continue;
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(row);
 }
 const modelEntries=new Map();
 for(const [key,files] of groups){
  const model=models[key]||{host:files[0].host,name:files[0].model,experiments:[]};
  const all=model.builds||[{...model,build:files[0].build||''}];
  const builds=all.filter(build=>{
   const candidates=files.filter(r=>(r.build||'')===build.build);
   return candidates.length&&modelMatches(build)&&
    matchesText([model.name,model.host,build.build,build.stage,build.module,...candidates.map(r=>r.relative)],query);
  });
  if(builds.length)modelEntries.set(key,{model,builds,total:all.length});
 }
 if(!modelEntries.has(activeModel)){
  activeModel=modelEntries.keys().next().value||'';activeBuild=null;active='';version='';
 }
 const current=modelEntries.get(activeModel);
 if(current&&!current.builds.some(b=>b.build===activeBuild)){
  activeBuild=current.builds[0].build;active='';version='';
 }
 const entries=Array.from(modelEntries,([key,{model,builds,total}])=>{
  const item=element('div');
  const b=button('',()=>{
   if(activeModel!==key){activeModel=key;activeBuild=null;active='';version='';selected.clear();render();}
  });
  b.replaceChildren(element('span',model.name),localized(element('small'),()=>
   model.host+' · '+count(total,['个版本','build','builds'])));
  b.className='item';b.setAttribute('aria-current',String(key===activeModel));item.append(b);
  if(key===activeModel&&builds.length>1){
   const list=element('div');list.className='model-builds';
   for(const build of builds){
    const choose=button(()=>build.build||t('history'),()=>{
     activeBuild=build.build;active='';version='';selected.clear();render();
    });
    choose.className='item';choose.setAttribute('aria-current',String(build.build===activeBuild));list.append(choose);
   }
   item.append(list);
  }
  return item;
 });
 $('items').replaceChildren(...entries);
 bindings.delete($('count'));localized($('count'),()=>count(modelEntries.size,['个模型','model','models']));
 const pane=$('detail');bindings.delete(pane);
 if(!current){localized(pane,()=>t('noModel'));return;}
 const m=current.builds.find(build=>build.build===activeBuild);
 const versions=m.versions||[];
 if(!versions.some(v=>v.batch===version))version=versions[0]?.batch??'';
 const snapshot=versions.find(v=>v.batch===version);
 const members=new Set(snapshot?.files||[]);
 const filesForModel=groups.get(activeModel).filter(r=>(r.build||'')===activeBuild);
 const unique=new Map();
 for(const row of filesForModel){
  if(!m.build&&row.relative?.match(/^(configs|logs)\//)&&versions.length&&!members.has(row.id))continue;
  const path=row.relative||row.label;
  if(!unique.has(path))unique.set(path,row);
 }
 shown=[...unique.values()];
 trimSelection();
 const previous=$('model-file-detail');
 const keep=previous&&shown.some(r=>r.id===active);
 const files=element('div'), actions=element('div'), fileCount=element('small');
 const preview=keep?previous:element('section');
 actions.id='model-actions';actions.className='actions model-actions';fileCount.id='file-count';
 files.className='model-files';preview.id='model-file-detail';
 const heading=element('div');heading.className='row model-heading';
 heading.append(element('h2',m.name+(m.build?' · '+m.build:'')));
 if(models[activeModel])heading.append(action('modelFolder',folder('model_folder',activeModel,activeBuild)));
 const picker=element('div');
 if(!m.build&&versions.some(v=>v.batch)){
  const select=field('metadata-version','history');
  select.append(...versions.map((v,i)=>localized(new Option('',v.batch),()=>
   [i===0?t('latest'):'',v.batch?batchDate(v.batch):'',v.historical?t('backfill'):''].filter(Boolean).join(' · '))));
  select.value=version;select.onchange=()=>{version=select.value;render();};
  const lab=element('label');lab.append(label('span','history'),' ',select);picker.append(lab);
  if(snapshot?.missing)picker.append(label('small','incomplete'));
 }
 const sectionOf=r=>r.type==='tensorboard'?'TensorBoard':r.type==='optuna'?'Optuna':
  r.relative?.startsWith('configs/')?'configurations':
  /^(logs|run_logs|html)\//.test(r.relative||'')||r.type==='process_log'?'logs':'results';
 for(const key of ['configurations','logs','results','TensorBoard','Optuna']){
  const items=shown.filter(r=>sectionOf(r)===key);
  if(!items.length)continue;
  const section=element('details');section.open=true;
  section.append(localized(element('summary'),()=>t(key)+' · '+items.length),...items.map(fileRow));files.append(section);
 }
 pane.replaceChildren(heading,element('small',m.host),...properties({...m,experiments:m.experiments||[]}),
                      picker,actions,fileCount,files,preview);
 if(!keep){active='';localized(preview,()=>t('selectFile'));}
 renderActions();
}
function renderActions(){
 const view=$('view').value, countLabel=$(modelPage?'file-count':'count');
 if(!countLabel)return;
 const ops=view==='trash'?['restore','purge']:[view==='archived'?'unarchive':'archive','delete'];
 bindings.delete(countLabel);
 localized(countLabel,()=>items(shown.length)+' · '+tr('已选 ','Selected ')+items(selected.size));
 const pick=action(selected.size?'clear':'selectAll',()=>{
  if(selected.size)selected.clear();else shown.filter(r=>!r.readonly).slice(0,500).forEach(r=>selected.add(r.id));
  render();
 });
 pick.disabled=!shown.some(r=>!r.readonly);
 $(modelPage?'model-actions':'actions').replaceChildren(pick,...ops.map(key=>{
  const b=action(key,async()=>{
   if(['delete','purge'].includes(key)&&!confirm(t(key)+' '+items(selected.size)+'?'))return;
   const result=await (await api('/api/action',{action:key,ids:[...selected]})).json();
   await refresh();selected.clear();active='';render();
   setNotice(()=>result.filter(r=>!r.ok).map(r=>(rows.find(item=>item.id===r.id)?.label||r.id)+' '+r.error)
    .join('\n')||t('processed')+' '+items(result.length));
  });b.disabled=selected.size===0;return b;
 }));
}
async function file(r,index,name,download=false){
 if(!download&&name.toLowerCase().endsWith('.xlsx'))return spreadsheet(r,index);
 const target=$('preview');bindings.delete(target);
 const response=await api(url('/api/file',{id:r.id,index}));
 if(!target?.isConnected)return;
 if(blobURL)URL.revokeObjectURL(blobURL);
 const mime=response.headers.get('Content-Type');
 if(!download&&(mime.startsWith('text/')&&mime!=='text/html'||mime==='application/json')){
  let content=await response.text();
  if(mime==='application/json')try{content=JSON.stringify(JSON.parse(content),null,2);}catch{}
  if(target.isConnected)target.replaceChildren(element('pre',content));
  return;
 }
 const blob=await response.blob();
 if(!target.isConnected)return;
 blobURL=URL.createObjectURL(blob);
 if(!download&&['text/html','application/pdf'].includes(blob.type)){
  const frame=element('iframe');if(blob.type==='text/html')frame.setAttribute('sandbox','');frame.title=name;
  frame.src=blobURL;target.replaceChildren(frame);
 }else{
  const anchor=localized(element('a'),()=>t('download')+' '+name);
  anchor.href=blobURL;anchor.download=name;target.replaceChildren(anchor);anchor.click();
 }
}
async function spreadsheet(r,index,sheet=''){
 const target=$('preview');
 bindings.delete(target);localized(target,()=>t('loadSheet'));
 const workbook=await (await api(url('/api/spreadsheet',{id:r.id,index,sheet}))).json();
 if(!target.isConnected)return;
 const select=field('sheet-select','worksheet');
 select.append(...workbook.sheets.map(name=>new Option(name,name)));
 select.value=workbook.sheet;
 select.onchange=()=>spreadsheet(r,index,select.value).catch(e=>setNotice(()=>t('actionError')+' · '+e.message));
 const grid=element('div'), table=element('table');grid.className='sheet';
 for(const values of workbook.rows){
  const row=table.insertRow();
  for(const value of values)row.insertCell().textContent=value;
 }
 grid.append(table);
 bindings.delete(target);target.replaceChildren(select,label('small','sheetLimit'),grid);
}
function link(run,key,prefix=''){
 const a=localized(element('a'),()=>t(key)+prefix);
 a.href=url(other,{run});a.target='_blank';a.rel='noopener';return a;
}
async function chapters(r,page){
 const target=$('preview');
 const data=await (await api(url('/api/chapters',{id:r.id,page,run:filters.get('run')||''}))).json();
 if(!target?.isConnected)return;
 target.replaceChildren();
 if(!data.pages)target.append(label('p','noChapters'));
 for(const c of data.chapters){
  const section=element('details'), idx=c.title.lastIndexOf(' · ');
  section.open=target.children.length===0;
  section.append(element('summary',c.title),link(c.title.slice(idx+3),'related'),element('pre',c.content));
  if(c.truncated)section.append(label('small','truncated'));
  target.append(section);
 }
 if(page>0)target.append(action('previous',()=>chapters(r,page-1)));
 if(page+1<data.pages)target.append(action('next',()=>chapters(r,page+1)));
}
async function details(r){
 active=r.id;
 for(const b of document.querySelectorAll('[data-file]'))b.setAttribute('aria-current',String(b.dataset.file===active));
 const pane=$(modelPage?'model-file-detail':'detail'), actions=element('div'), preview=element('div');
 bindings.delete(pane);actions.className='actions';preview.id='preview';
 pane.replaceChildren(element('h2',r.label),actions,preview);
 if(r.trashed){localized(preview,()=>t('mustRestore'));return;}
 actions.append(action('folder',folder('folder',r.id)));
 if(r.type==='mail'){
  const m=r.metadata;
  pane.insertBefore(localized(element('pre'),()=>[m.task,t(m.status||''),m.script,m.source,m.revision,m.started_at,m.finished_at,m.task_run_id,
   t('smtp')+' · '+t(m.smtp_status||'unknown'),m.missing_attachments?.length?
   t('missing')+' · '+m.missing_attachments.join(', '):''].filter(Boolean).join('\n')),actions);
  for(const id of m.model_runs||[])actions.append(link(id,'modelRun',' '+id.slice(0,8)));
  r.files.forEach((name,i)=>{
   actions.append(button(()=>r.mail_parts?.[i]?t(r.mail_parts[i]):name,()=>file(r,i,name)));
   if(i>0)actions.append(button(()=>t('download')+' '+(r.mail_parts?.[i]?t(r.mail_parts[i]):name),()=>file(r,i,name,true)));
  });
  if(r.files.length)await file(r,0,r.files[0]);
 }else if(r.type==='process_log'){
  actions.append(action('downloadMD',()=>file(r,0,r.label,true)));
  await chapters(r,0);
 }else if(['tensorboard','optuna'].includes(r.type)){
  actions.append(action('start',async()=>{
   const result=await (await api('/api/action',{action:'start',id:r.id})).json();
   const address=result.url||result.instance?.url;
   if(!address)throw Error(t('ready'));
   const a=label('a','openInstance');a.href=address;a.target='_blank';a.rel='noopener';
   bindings.delete(preview);preview.replaceChildren(a);
  }),action('stop',async()=>{
   await api('/api/action',{action:'stop',id:r.id});bindings.delete(preview);localized(preview,()=>t('stopped'));
  }));
 }else{
  actions.append(action('preview',()=>file(r,0,r.label)),action('download',()=>file(r,0,r.label,true)));
  if(r.run&&!r.historical)actions.append(link(r.run,'related'));
  if(/\.(md|txt|html|pdf|xlsx|json|jsonl|ya?ml|log|toml)$/i.test(r.label))await file(r,0,r.label);
 }
}
setup();
refresh();
</script>
