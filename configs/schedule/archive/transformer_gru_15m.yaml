# Parallel experiment for gru_15m_new (ResNet-GRU): replace only the daily encoder.
# [B, 30, 16, 6] -> shared daily Transformer -> [B, 30, 32] -> GRU -> [B, 1].
model:
  # main model configs ----------------------------------------------------------------
  module        : transformer_gru  # intra-day Transformer bar encoder + day GRU
  submodels     : [best] # subset of ['best' , 'swalast' , 'swabest'] , but for boost , only use best

  window  : 2400

  # labels specification ------------------------------------------------------------
  # rtn : raw return | std : standardized return | res : risk model residual
  # if module is nn , use multiloss combination of the labels
  # if module is boost , only use the first label
  labels: 
    - rtn_lag1_5 # any of [res_lag1_10, res_lag1_20, rtn_lag1_10, rtn_lag1_20, std_lag1_10, std_lag1_20]

  special:
    global2top: true

input:  # input specification ----------------------------------------------------------------
  type: data # [data , hidden , factor] , specify below
  data.types: 15m # ['day+30m' , 30m , day , ...] , use if input_type is data
  sequence.lens: {15m: 30}
  sequence.steps: {15m: 1}

train:
  criterion.weight:
    fit:    'polar'
  criterion.loss: 
    ccc_hcorr: {alpha : 0.1}
  trainer.learn_rate:
    base: 0.001
  trainer.scheduler:
    name: cycle
    param: {base_lr: 1.0e-7, step_size_up: 12}

callbacks:
  ActivationCheckpointing:
    enabled: true # CUDA OOM restarts this model with checkpointing; sticky for this run
  LearnRateReset:
    num_reset: 2
    trigger: 40
    recover_level: 0.3
    speedup2x: true

algo:
  transformer_gru:
    hidden_dim:     [64]
    seqlens:        [{'15m': 30}]
    dropout:        [0.1]
    enc_in_dim:     [32]   # daily representation width, same as the ResNet baseline
    enc_att:        [false]
    enc_layers:     [2]    # shared Transformer over each day's 16 bars; last token summarizes the day
    rnn_type:       ['gru']
    rnn_layers:     [2]    # GRU over 30 daily representations, hidden_dim=64
    which_output:   [0]
