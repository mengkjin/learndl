model:
  # main model configs ----------------------------------------------------------------
  module        : resnet_gru_new  # any of [nn defined in src/algo/nn/api.py] or ['boost' , 'lgbm' , 'ada' , 'xgboost' , 'catboost']
  submodels     : [best] # subset of ['best' , 'swalast' , 'swabest'] , but for boost , only use best

  window  : 2400

  # labels specification ------------------------------------------------------------
  # rtn : raw return | std : standardized return | res : risk model residual
  # if module is nn , use multiloss combination of the labels
  # if module is boost , only use the first label
  labels: 
    - rtn_lag1_10 # any of [res_lag1_10, res_lag1_20, rtn_lag1_10, rtn_lag1_20, std_lag1_10, std_lag1_20]

  special:
    global2top: true

input:  # input specification ----------------------------------------------------------------
  data.prenorm.15m: {divlast: false, histnorm: true, channelnorm: false}
  type: data # [data , hidden , factor] , specify below
  data.types: 15m # ['day+30m' , 30m , day , ...] , use if input_type is data
  sequence.lens: {15m: 30}
  sequence.steps: {15m: 1}

env:
  random_seed: 17

train:
  criterion.loss:
    global2top:
      top_option: capped_soft_topk
  criterion.weight:
    fit:    'polar'
  # criterion.loss: 
  #   ccc_hcorr: {alpha : 0.1}
  trainer.learn_rate:
    base: 0.001
  trainer.scheduler:
    name: cycle
    param: {base_lr: 1.0e-7, step_size_up: 12}

callbacks:
  SpecificCB_Global2Top:
    min_top_epochs: 20
    transition_epochs: 10
    verify_recall: true
    gradient_diagnostics: false
  LearnRateReset:
    num_reset: 2
    trigger: 40
    recover_level: 0.3
    speedup2x: true

algo:
  resnet_gru_new:
    resnet_pool:    [flatten]
    hidden_dim:     [64] #  2**5
    seqlens:        [{'15m': 30}] # although not a param for model, but can be different values(dict of SEQLEN) #
    dropout:        [0.1]
    enc_in:         [true] # per-bar Linear + Tanh
    enc_in_dim:     [16]   # per-bar projection width
    inday_resnet_dim: [32] # daily ResNet output / cross-day GRU input
    enc_att:        [false] 
    rnn_type:       ['gru'] # 'gru' , 'lstm' , 'transformer' , 'tcn'
    rnn_layers:     [2]
    resnet_blocks:  [1]
    dim_med:        [null] # null: max(1, inday_resnet_dim // 4); or a positive integer
