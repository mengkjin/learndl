model:
  # main model configs ----------------------------------------------------------------
  module        : astgnn  # any of [nn defined in src/algo/nn/api.py] or ['boost' , 'lgbm' , 'ada' , 'xgboost' , 'catboost']
  submodels     : [best] # subset of ['best' , 'swalast' , 'swabest'] , but for boost , only use best

  # labels specification ------------------------------------------------------------
  # rtn : raw return | std : standardized return | res : risk model residual
  # Column 0: alpha fit return; column 1: joint alpha/beta explanation return.
  # Horizons can change here; keep skip_horizon > max(lag + days).
  labels: 
    - rtn_lag1_5
    - rtn_lag1_20


input:  # input specification ----------------------------------------------------------------
  type: data # [data , hidden , factor] , specify below
  data.types: 15m+day+style # ['15m+day+style' , 15m , day , style , ...] , use if input_type is data
  sequence.lens: {15m: 30 , day: 30 , style: 30}
  sequence.steps: {15m: 1 , day: 1 , style: 1}

train:
  label_normalization: raw
  skip_horizon: 22
  dataloader.sample_method: sequential
  criterion.weight:
    fit:    'equal'

algo:
  astgnn:
    ab_split_input: true
    ab_split_pos: 1
    resnet_projector: true
    beta_into_pred: [false]
  
