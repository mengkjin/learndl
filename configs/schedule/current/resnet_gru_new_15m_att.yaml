model:
  module: resnet_gru_new
  submodels:
  - best
  window: 2400
  labels:
  - std_lag1_10
  special:
    global2top: true
  name: resnet_gru_new_15m_pool
input:
  data.prenorm.15m:
    divlast: false
    histnorm: true
    channelnorm: false
  type: data
  data.types: 15m
  sequence.lens:
    15m: 30
  sequence.steps:
    15m: 1
train:
  criterion.weight:
    fit: equal
  trainer.learn_rate:
    base: 0.001
  trainer.scheduler:
    name: cycle
    param:
      base_lr: 1.0e-07
      step_size_up: 12
callbacks:
  LearnRateReset:
    num_reset: 2
    trigger: 40
    recover_level: 0.3
    speedup2x: true
algo:
  resnet_gru_new:
    resnet_pool:
    - attention
    hidden_dim:
    - 64
    seqlens:
    - 15m: 30
    dropout:
    - 0.1
    enc_in:
    - true
    enc_in_dim:
    - 16
    inday_resnet_dim:
    - 32
    enc_att:
    - false
    rnn_type:
    - gru
    rnn_layers:
    - 2
    resnet_blocks:
    - 1
    dim_med:
    - null
    hidden_as_factors:
    - true
    hidden_mean_pool:
    - false
    resnet_pool_conv_layers:
    - 1
env:
  random_seed: 0
