# 服务器空闲时运行一次；仅已提交并同步到服务器的本文件变更触发自动调度。
# enabled 只控制自动调度；手动 CLI 仍可运行。修改 rerun_mark 并提交可重新训练。
# mode: single（单次实验）或 walk_forward（季度滚动，完整方案计算量较大）。
# recipient: null 沿用项目邮箱；no_email: true 关闭本任务及兜底邮件。
# single.start/end 是行情范围；train_end_date/valid_end_date 是按时间划分的边界。
# total_timesteps 是 PPO 训练步数，seed 是随机种子，device 默认 cuda。
# reward.turnover_penalty 是扣除真实费用后额外施加的换手偏好。
# walk_forward.seeds 会全部运行；penalties/bonuses 是筛选网格。
# primary_cost_bp/costs_bp 是额外单边成本（基点），不是替代已有交易费率。
# panel 必须指向已有兼容快照；季度实验不会隐式准备行情。
# output/output_root 是结果根目录；自动任务在其 automatic/<请求编号> 下隔离结果。
# 自动执行默认每版本一次，失败不自动重试；运行期间的新版本在本次结束后等待执行。
