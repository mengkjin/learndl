tasks:
  daily_update:
    entrypoint: daily_update
    args: []
    lock_group: daily_update
    overlap: wait
    timeout: 12h
  daily_update_force:
    entrypoint: daily_update
    args: [--forfeit_if_done, 'False']
    lock_group: daily_update
    overlap: wait
    timeout: 12h
  production_model_update:
    entrypoint: production_model_update
    args: []
    lock_group: daily_update
    overlap: wait
    timeout: 12h
  weekly_update:
    entrypoint: weekly_update
    args: []
    lock_group: weekly_update
    overlap: skip
    timeout: 72h
  rcquant_sec_backfill:
    entrypoint: rcquant_sec_backfill
    args: [--max_days, 'none']
    lock_group: rcquant_sec_backfill
    channel: independent
    window: rcquant_evening
    overlap: skip
    timeout: null
