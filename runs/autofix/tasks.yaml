# Autofix 通知规则：统一强制传入 email=true，覆盖脚本默认值和旧条目的 email=false。
# watchdog 另发启动流程邮件；同一 ID 最多尝试一次，修改邮件设置不会重跑。
schema_version: 1
fixes:
  - id: 20261014_create_open_vwap_datablocks_01
    description: 先生成六组次日 open/VWAP 原始收益标签，再重建 y_open/y_vwap 的 fit 和 predict DataBlock；不改旧收盘价标签。
    script: scripts/.autofix/create_open_vwap_datablocks.py
    params:
      dry_run: false
      email: true
    timeout: 48h
    enabled: true
  - id: 20261015_rename_label_datablocks_01
    description: 将 fit/predict 中旧 X_y_* DataBlock 改名为 Y_*，仅重命名，不重新计算标签或数据。
    script: scripts/.autofix/rename_label_datablocks.py
    params:
      dry_run: false
      email: true
    timeout: 30m
    enabled: true
  - id: 20261017_repair_15mraw_train_02
    description: 按需备份重算 15mraw 的 fit/predict DataBlock；两份校验通过后请求 gru_15mraw 优先训练，由训练服务在维护结束且 GPU 空闲时启动。
    script: scripts/.autofix/repair_15mraw_datablocks.py
    params:
      dry_run: false
      email: true
    timeout: 12h
    enabled: false
  - id: 20261018_repair_15mraw_inf_train_03
    description: 按需重建 15mraw，逐个追查 Inf 的原始记录与溢出/除零证据，再转为 NaN；两份数据校验通过后请求 gru_15mraw 训练。
    script: scripts/.autofix/repair_15mraw_inf.py
    params:
      dry_run: false
      email: true
    timeout: 12h
    enabled: true
