watchdog:
  tick_seconds: 60
  units: []
  jobs:
    task_lifecycle: {enabled: true, interval_seconds: 60}
    task_timeouts: {enabled: true, interval_seconds: 60}
    systemd_unit_probe: {enabled: true, interval_seconds: 60}
    cli_recovery: {enabled: true, interval_seconds: 60}
    task_monitor_cache:
      enabled: true
      interval_seconds: 900
      max_sources: 20
      max_seconds: 20
    idle_worklist:
      enabled: true
      interval_seconds: 60
      max_gpu_memory_percent: 20
      progress_timeout_seconds: 43200
      recovery_enabled: true
      recovery_max_retries: 3
      recovery_delay_seconds: 60
      recovery_min_available_memory_percent: 20
    git_auto_update:
      enabled: true
      interval_seconds: 300
      max_seconds: 45
    autofix:
      enabled: true
      interval_seconds: 60
